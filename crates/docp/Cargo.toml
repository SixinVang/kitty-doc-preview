[package]
name = "docp"
description = "Preview PDFs, images and Markdown in kitty-graphics terminals (Rex)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "docp"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
crossterm = { workspace = true }
image = { workspace = true }
notify = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
xxhash-rust = { workspace = true }

docmodel = { path = "../docmodel" }
kgp = { path = "../kgp" }
render-img = { path = "../render-img" }
render-md = { path = "../render-md", features = ["syntaxes"] }
render-pdf = { path = "../render-pdf" }
termui = { path = "../termui" }
