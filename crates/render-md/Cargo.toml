[package]
name = "render-md"
description = "Markdown hybrid rendering: text layout, syntax highlight, big-type headings, Mermaid"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
syntaxes = ["dep:syntect", "dep:two-face"]

[dependencies]
docmodel = { path = "../docmodel" }
kgp = { path = "../kgp" }
pulldown-cmark = { workspace = true }
resvg = { workspace = true }
rquickjs = { workspace = true }
syntect = { workspace = true, optional = true }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"], optional = true }
ttf-parser = { workspace = true }
unicode-width = { workspace = true }
xxhash-rust = { workspace = true }
yaml-rust2 = { workspace = true }
crossbeam-channel = { workspace = true }
png = { workspace = true }
