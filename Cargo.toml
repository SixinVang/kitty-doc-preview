[workspace]
resolver = "2"
members = [
    "crates/kgp",
    "crates/termui",
    "crates/docmodel",
    "crates/render-img",
    "crates/docp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
image = { version = "0.25", features = ["rayon"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
